name: Build and deploy

# Every push to main is a release. The service worker's precache list and
# cache name are regenerated from a hash of every file it serves, so any
# change reaches installed copies with nothing to bump by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # A wrong formula or a missing translation must never reach the site.
      - name: Tests
        run: node --test 'tests/*.test.js'

      - name: Regenerate the service worker
        run: node tools/build-sw.mjs

      # Publish only what the app serves: no tools, specs, tests or references.
      - name: Assemble the site
        run: |
          mkdir -p _site
          for item in index.html manifest.webmanifest favicon.ico sw.js whatsnew.js css js data icons; do
            cp -r "$item" _site/
          done
          touch _site/.nojekyll
          find _site -type f | wc -l | xargs echo "files:"
          grep -E "^const CACHE" _site/sw.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
